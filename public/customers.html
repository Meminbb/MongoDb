<!DOCTYPE html>
<html>
<head>
  <title>Customers</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="container py-5">

<h1>Customers</h1>

<div class="mb-3">
  <input
    id="customerSearch"
    class="form-control"
    placeholder="Search customer..."
    onkeyup="loadCustomers()"
  >
</div>

<div class="row">

  <div class="col-md-6">

    <input id="firstName" class="form-control mb-2" placeholder="First Name">

    <input id="lastName" class="form-control mb-2" placeholder="Last Name">

    <input id="email" class="form-control mb-2" placeholder="Email">

    <input id="city" class="form-control mb-2" placeholder="City">

    <input id="age" class="form-control mb-2" placeholder="Age">

    <button class="btn btn-warning" onclick="createCustomer()">
      Add Customer
    </button>

  </div>

</div>

<hr>

<table class="table table-bordered">

  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>City</th>
      <th>Age</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody id="customersTable"></tbody>

</table>

<script src="app.js"></script>

<script>
loadCustomers();
</script>

</body>
</html>
