<!DOCTYPE html>
<html>
<head>
  <title>Movies</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="container py-5">

<h1>Movies</h1>

<div class="mb-3">
  <input
    id="search"
    class="form-control"
    placeholder="Search movie..."
    onkeyup="loadMovies()"
  >
</div>

<div class="row">

  <div class="col-md-6">
    <input id="title" class="form-control mb-2" placeholder="Title">
    <input id="year" class="form-control mb-2" placeholder="Year">
    <input id="price" class="form-control mb-2" placeholder="Price">

    <select id="genres" class="form-select mb-2" multiple></select>

    <button class="btn btn-primary" onclick="createMovie()">
      Add Movie
    </button>
  </div>

</div>

<hr>

<table class="table">
  <thead>
    <tr>
      <th>Title</th>
      <th>Year</th>
      <th>Genres</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody id="moviesTable"></tbody>
</table>

<script src="app.js"></script>

<script>
loadMovies();
loadGenresSelect();
</script>

</body>
</html>
