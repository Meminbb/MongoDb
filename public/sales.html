<!DOCTYPE html>
<html>

<head>

  <title>Sales</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

</head>

<body class="container py-5">

<h1 class="mb-4">Sales</h1>


<div class="row">

  <div class="col-md-6">

    <select
      id="saleCustomer"
      class="form-select mb-2"
    ></select>


    <select
      id="saleMovie"
      class="form-select mb-2"
    ></select>


    <input
      id="salePrice"
      class="form-control mb-2"
      placeholder="Price"
      type="number"
    >


    <button
      class="btn btn-dark"
      onclick="createSale()"
    >
      Add Sale
    </button>

  </div>

</div>

<hr>

<table class="table table-bordered">

  <thead>
    <tr>
      <th>ID</th>
      <th>Customer</th>
      <th>Movie</th>
      <th>Price</th>
      <th>Payment</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody id="salesTable"></tbody>

</table>


<script src="app.js"></script>

<script>
loadSales();
loadCustomersSelect();
loadMoviesSelect();
</script>

</body>
</html>
